{% extends "app/dashboard.html" %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h5 class="card-title">Gérer le stock</h5>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="form-label">Article</label>
                    {{ form.article }}
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Emplacement</label>
                    {{ form.emplacement }}
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Quantité disponible</label>
                    {{ form.quantite_disponible }}
                </div>
            </div>
            <div class="mt-3">
                <button class="btn btn-primary">Enregistrer</button>
                <a href="{% url 'stock_list' %}" class="btn btn-secondary">Annuler</a>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary ms-2">Retour au dashboard</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
